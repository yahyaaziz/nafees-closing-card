<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Nafees — Closing Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#211D18; --paper:#FAF7F0; --paper-warm:#F1E9D8;
    --brass:#A9803F; --brass-dark:#8B6B32; --oxblood:#6E2430; --patina:#4C6B4F;
    --neutral:#8A8073; --line: rgba(33,29,24,0.12); --line-strong: rgba(33,29,24,0.22);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%;}
  body{background:#E7E0D0; font-family:'Inter',sans-serif; color:var(--ink);
    display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px 12px;}
  .phone{width:100%; max-width:400px; height:min(820px, 92vh); background:var(--paper);
    border-radius:28px; box-shadow:0 30px 60px -20px rgba(33,29,24,0.35), 0 0 0 1px var(--line);
    overflow:hidden; display:flex; flex-direction:column; position:relative;}
  .topbar{display:flex; align-items:center; justify-content:space-between; padding:18px 18px 12px; flex-shrink:0;}
  .back-btn{width:36px; height:36px; border-radius:50%; border:1px solid var(--line-strong); background:transparent;
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink); visibility:hidden;}
  .back-btn.show{visibility:visible;}
  .dots{display:flex; gap:6px;}
  .dot{width:7px; height:7px; border-radius:50%; background:var(--line-strong); transition:background .25s, transform .25s;}
  .dot.done{background:var(--brass);} .dot.current{background:var(--brass); transform:scale(1.3);}
  .brand-mark{font-family:'Fraunces',serif; font-weight:600; font-size:13px; letter-spacing:.08em; color:var(--brass-dark); text-transform:uppercase;}
  .demo-reset{font-size:11px; color:#9C9282; text-decoration:underline; cursor:pointer; background:none; border:none; font-family:'Inter',sans-serif;}
  main{flex:1; overflow-y:auto; padding:4px 22px 22px; display:flex; flex-direction:column;}
  h1.title{font-family:'Fraunces',serif; font-weight:600; font-size:23px; line-height:1.18; margin:6px 0 4px;}
  p.sub{color:#7A7266; font-size:13.5px; line-height:1.4; margin:0 0 16px;}
  .tile-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
  .tile{border:1.5px solid var(--line-strong); border-radius:14px; background:var(--paper); padding:14px 12px;
    text-align:left; cursor:pointer; display:flex; flex-direction:column; gap:8px; transition:border-color .15s, background .15s, transform .1s; position:relative;}
  .tile:active{transform:scale(.97);}
  .tile .icon{width:24px; height:24px; color:var(--brass-dark);}
  .tile .label{font-family:'Inter',sans-serif; font-weight:600; font-size:14px;}
  .tile .count{font-size:11px; color:#9C9282;}
  .sub-list-item{border:1.5px solid var(--line-strong); border-radius:12px; background:var(--paper); padding:14px 16px;
    margin-bottom:9px; cursor:pointer; font-weight:600; font-size:14.5px; transition:border-color .15s, background .15s, transform .1s;}
  .sub-list-item:active{transform:scale(.98);}
  .back-inline{font-size:12.5px; color:var(--brass-dark); text-decoration:underline; cursor:pointer; margin-bottom:12px; display:inline-block;}
  .chip-row{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;}
  .chip{background:var(--paper-warm); border:1px solid var(--line-strong); border-radius:999px; padding:6px 8px 6px 12px;
    font-size:12px; display:flex; align-items:center; gap:6px; max-width:100%;}
  .chip span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .chip button{border:none; background:none; cursor:pointer; color:#9C9282; font-size:14px; line-height:1; padding:2px;}

  .option-card{border:1.5px solid var(--line-strong); border-radius:16px; background:var(--paper); padding:15px 18px;
    margin-bottom:10px; cursor:pointer; transition:border-color .15s, background .15s, transform .1s;}
  .option-card:active{transform:scale(.98);}
  .option-card.selected{border-color:var(--brass); background:var(--paper-warm);}
  .option-card .opt-label{font-weight:600; font-size:14.5px;}
  .option-card .opt-hint{font-size:12px; color:#8A8073; margin-top:3px;}
  .outcome-card{display:flex; align-items:center; gap:12px;}
  .outcome-dot{width:10px; height:10px; border-radius:50%; flex-shrink:0;}

  .footer-note{margin-top:auto; padding-top:8px; font-size:11.5px; color:#A69C8D; text-align:center;}
  .cta{width:100%; padding:15px; border-radius:14px; border:none; background:var(--brass); color:var(--paper);
    font-family:'Inter',sans-serif; font-weight:600; font-size:15px; cursor:pointer; margin-top:auto;}
  .cta:active{background:var(--brass-dark);}
  .cta:disabled{background:var(--line-strong); color:#A69C8D; cursor:not-allowed;}
  .cta.ghost{background:transparent; border:1.5px solid var(--line-strong); color:var(--ink); margin-top:10px;}

  .yesno-row{display:flex; gap:10px; margin-bottom:8px;}
  .yesno-btn{flex:1; padding:15px; border-radius:12px; border:1.5px solid var(--line-strong); background:var(--paper);
    font-weight:600; font-size:14.5px; cursor:pointer; text-align:center; transition:border-color .15s, background .15s;}
  .yesno-btn.active{border-color:var(--brass); background:var(--paper-warm);}
  .text-input{width:100%; padding:13px 14px; border:1.5px solid var(--line-strong); border-radius:10px;
    font-family:'Inter',sans-serif; font-size:14px; margin-bottom:10px; background:var(--paper); color:var(--ink);}
  .text-input::placeholder{color:#B3A99A;}
  .field-label{font-size:12px; color:#8A8073; margin-bottom:5px; font-weight:600;}

  .home-wrap{display:flex; flex-direction:column; height:100%;}
  .home-header{margin-bottom:26px;}
  .home-greeting{font-family:'Fraunces',serif; font-weight:600; font-size:22px;}
  .home-sub{color:#8A8073; font-size:13.5px; margin-top:4px;}
  .big-cta{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
    border:1.5px dashed var(--line-strong); border-radius:20px; cursor:pointer; background:var(--paper-warm); transition:border-color .15s;}
  .big-cta:active{border-color:var(--brass);}
  .big-cta .plus{width:56px; height:56px; border-radius:50%; background:var(--brass); color:var(--paper);
    display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:400;}
  .big-cta .cta-label{font-family:'Fraunces',serif; font-weight:600; font-size:17px;}
  .stat-row{display:flex; justify-content:space-between; align-items:center; margin-top:18px; padding-top:16px; border-top:1px solid var(--line);}
  .stat-num{font-family:'IBM Plex Mono',monospace; font-weight:500; font-size:20px; color:var(--brass-dark);}
  .stat-label{font-size:12px; color:#8A8073;}
  .change-staff{font-size:12.5px; color:#8A8073; text-decoration:underline; cursor:pointer; text-align:center; margin-top:14px;}

  .staff-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .staff-tile{border:1.5px solid var(--line-strong); border-radius:16px; padding:20px 10px; text-align:center; cursor:pointer; background:var(--paper);}
  .staff-tile:active{transform:scale(.97);}
  .staff-avatar{width:44px; height:44px; border-radius:50%; background:var(--paper-warm); border:1.5px solid var(--line-strong);
    display:flex; align-items:center; justify-content:center; margin:0 auto 10px; font-family:'Fraunces',serif; font-weight:600; font-size:16px; color:var(--brass-dark);}
  .staff-name{font-weight:600; font-size:14px;}

  .confirm-wrap{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;}
  .stamp{width:128px; height:128px; border-radius:50%; border:3px solid var(--oxblood); display:flex; flex-direction:column;
    align-items:center; justify-content:center; color:var(--oxblood); position:relative;
    transform:scale(0.4) rotate(-14deg); opacity:0; animation: stamp-press .55s cubic-bezier(.2,1.4,.4,1) .1s forwards;}
  .stamp::before{content:''; position:absolute; inset:8px; border:1px solid var(--oxblood); border-radius:50%; opacity:.55;}
  .stamp .stamp-mark{font-size:26px; margin-bottom:4px;}
  .stamp .stamp-code{font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.06em;}
  @keyframes stamp-press{0%{transform:scale(0.4) rotate(-14deg); opacity:0;} 60%{transform:scale(1.08) rotate(-2deg); opacity:1;} 100%{transform:scale(1) rotate(-4deg); opacity:1;}}
  .confirm-title{font-family:'Fraunces',serif; font-weight:600; font-size:19px; margin-top:22px;}
  .confirm-sub{font-size:13.5px; color:#8A8073; margin-top:6px;}
  @media (prefers-reduced-motion: reduce){.stamp{animation:none; transform:scale(1) rotate(-4deg); opacity:1;}}
</style>
</head>
<body>

<div class="phone">
  <div class="topbar">
    <button class="back-btn" id="backBtn" onclick="goBack()">&#8592;</button>
    <div id="topMid" class="brand-mark">Nafees</div>
    <button class="demo-reset" onclick="resetDemo()">reset</button>
  </div>
  <main id="app"></main>
</div>

<script>
const CATEGORY_TREE = [
  {id:'rings', label:'Rings', icon:'ring', subs:[
    {id:'ring', label:'Ring'}, {id:'male_ring', label:'Male Ring'},
    {id:'kids_ring', label:'Kids Ring'}, {id:'diamond_ring', label:'Diamond Ring'}
  ]},
  {id:'ear', label:'Ear Jewellery', icon:'drop', subs:[
    {id:'tops', label:'Tops'}, {id:'stud_tops', label:'Stud Tops'},
    {id:'d_baali', label:'D Baali'}, {id:'baalian', label:'Baalian'}, {id:'kaanta', label:'Kaanta'}
  ]},
  {id:'neck', label:'Neck Jewellery', icon:'circle', subs:[
    {id:'chain', label:'Chain'}, {id:'locket', label:'Locket'},
    {id:'locket_set', label:'Locket Set'}, {id:'maala_set', label:'Maala Set'}
  ]},
  {id:'bridal', label:'Bridal', icon:'set', subs:[
    {id:'heavy_bridal_set', label:'Heavy Bridal Set'}, {id:'big_box_set', label:'Big Box Set'},
    {id:'small_gani_set', label:'Small Gani Set'}, {id:'stone_panni_set', label:'Stone Panni Set'},
    {id:'m_stone_panni_set', label:'M Stone Panni Set'}, {id:'gold_panni_set', label:'Gold Panni Set'}
  ]},
  {id:'hand', label:'Hand Jewellery', icon:'circle', subs:[
    {id:'bangles', label:'Bangles'}, {id:'gold_kara', label:'Gold Kara'}, {id:'bracelet', label:'Bracelet'}
  ]},
  {id:'other', label:'Other', icon:'other', subs:[
    {id:'nose_pin', label:'Nose Pin'}, {id:'palladium_ring', label:'Palladium Ring'}

// Weight bands per category, taken directly from the BI dashboard's own Light/Medium/Heavy
// tercile analysis (Section 4) — not an invented scale. Categories absent here (Heavy Bridal
// Set, Nose Pin, Palladium Ring) had no sales this period to derive bands from, so the weight
// question is skipped entirely for them rather than guessed at.
const WEIGHT_BANDS = {
  ring: [{v:'light', label:'Light', range:'1.2–3.2g'}, {v:'medium', label:'Medium', range:'3.2–4.7g'}, {v:'heavy', label:'Heavy', range:'4.8–10.4g'}],
  male_ring: [{v:'light', label:'Light', range:'3.0–3.7g'}, {v:'medium', label:'Medium', range:'3.8–5.0g'}, {v:'heavy', label:'Heavy', range:'5.7–9.0g'}],
  kids_ring: [{v:'light', label:'Light', range:'0.4–0.6g'}, {v:'medium', label:'Medium', range:'0.7–0.8g'}, {v:'heavy', label:'Heavy', range:'0.9–1.1g'}],
  diamond_ring: [{v:'light', label:'Light', range:'3.4–4.6g'}, {v:'medium', label:'Medium', range:'4.6–6.5g'}, {v:'heavy', label:'Heavy', range:'8.0–8.6g'}],
  tops: [{v:'light', label:'Light', range:'2.6–4.7g'}, {v:'medium', label:'Medium', range:'5.6–5.8g'}, {v:'heavy', label:'Heavy', range:'10.1g'}],
  stud_tops: [{v:'light', label:'Light', range:'0.6–0.9g'}, {v:'medium', label:'Medium', range:'0.9g'}, {v:'heavy', label:'Heavy', range:'1.1–1.3g'}],
  d_baali: [{v:'light', label:'Light', range:'2.9–3.6g'}, {v:'medium', label:'Medium', range:'3.7–4.1g'}, {v:'heavy', label:'Heavy', range:'4.1–4.7g'}],
  baalian: [{v:'light', label:'Light', range:'2.4–3.6g'}, {v:'medium', label:'Medium/Heavy', range:'3.9–13.2g'}],
  kaanta: [{v:'light', label:'Light', range:'3.7–3.8g'}, {v:'medium', label:'Medium/Heavy', range:'4.8–5.2g'}],
  chain: [{v:'light', label:'Light', range:'2.7–4.3g'}, {v:'medium', label:'Medium', range:'4.3–5.7g'}, {v:'heavy', label:'Heavy', range:'7.3–11.5g'}],
  locket: [{v:'light', label:'Light', range:'2.1g'}, {v:'medium', label:'Medium', range:'2.3g'}, {v:'heavy', label:'Heavy', range:'4.2g'}],
  locket_set: [{v:'light', label:'Light', range:'9.7–9.8g'}, {v:'medium', label:'Medium', range:'10.6–12.7g'}, {v:'heavy', label:'Heavy', range:'16.6–52.6g'}],
  maala_set: [{v:'light', label:'Light', range:'10.4–12.3g'}, {v:'medium', label:'Medium', range:'12.9–15.1g'}, {v:'heavy', label:'Heavy', range:'15.2g'}],
  big_box_set: [{v:'light', label:'Light', range:'39.6–44.0g'}, {v:'medium', label:'Medium', range:'47.0–54.0g'}, {v:'heavy', label:'Heavy', range:'61.8g'}],
  small_gani_set: [{v:'light', label:'Light', range:'23.1–24.6g'}, {v:'medium', label:'Medium/Heavy', range:'29.1–33.2g'}],
  stone_panni_set: [{v:'light', label:'Light', range:'17.6–19.4g'}, {v:'medium', label:'Medium', range:'19.9–31.9g'}, {v:'heavy', label:'Heavy', range:'32.0–39.2g'}],
  m_stone_panni_set: [{v:'light', label:'Light', range:'35.8g'}, {v:'medium', label:'Medium', range:'38.0g'}, {v:'heavy', label:'Heavy', range:'38.3g'}],
  gold_panni_set: [{v:'light', label:'Light', range:'14.2–24.0g'}, {v:'medium', label:'Medium', range:'28.1–32.1g'}, {v:'heavy', label:'Heavy', range:'38.6g'}],
  bangles: [{v:'light', label:'Light', range:'23.7–34.8g'}, {v:'medium', label:'Medium', range:'48.8–60.8g'}, {v:'heavy', label:'Heavy', range:'64.9–85.2g'}],
  gold_kara: [{v:'light', label:'Light', range:'17.2–31.3g'}, {v:'medium', label:'Medium', range:'31.8–40.8g'}, {v:'heavy', label:'Heavy', range:'43.3–44.4g'}],
  bracelet: [{v:'light', label:'Light', range:'6.4g'}, {v:'medium', label:'Medium', range:'11.7–14.8g'}, {v:'heavy', label:'Heavy', range:'19.9–35.1g'}]
};

// EDIT ME: replace with your real staff names before deployment.
const STAFF = [{id:'s1', name:'Yahya'}, {id:'s2', name:'Zahid'}, {id:'s3', name:'Sana'}, {id:'s4', name:'Hina'}];

// EDIT ME: paste your Google Apps Script Web App URL here after deploying nafees-apps-script-backend.gs
const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbzW9v6KTiVUNwTWA__rnO4oYzcCYIpgWS5tJ2FtE0e-KlZmG3wmA-N0qWoP_c9fFELN/exec';

// Two step sequences, sharing the same first four steps. Everything downstream forks by channel.
const PHYSICAL_STEPS = ['timestamp','channel','gender','context','consideration','group','refreshment','variant','price','outcome'];
const ONLINE_STEPS   = ['timestamp','channel','gender','context','consideration','image','price','outcome'];
function activeSteps(){ return state.channel==='online' ? ONLINE_STEPS : PHYSICAL_STEPS; }

const HISTORY_OPTIONS = [
  {v:'', label:'Not indicated'},
  {v:'longstanding_stated', label:'Longstanding — customer stated it'},
  {v:'longstanding_recognized', label:'Longstanding — you/Zahid recognize it'},
  {v:'new_stated', label:'New customer — stated'},
  {v:'new_orientation', label:'New customer — asked orientation questions'}
];
const PHYSICAL_OUTCOME_OPTIONS = [
  {v:'purchased', label:'Purchased', hint:'Linked automatically from the register', color:'var(--patina)'},
  {v:'reserved_deposit', label:'Reserved, with deposit', hint:'Existing item, partial payment, pickup later', color:'var(--brass)'},
  {v:'custom_order', label:'Custom order placed', hint:'New piece to be made, deposit taken', color:'var(--brass-dark)'},
  {v:'held_no_deposit', label:'Held, no deposit', hint:'Item set aside, no payment', color:'var(--neutral)'},
  {v:'left', label:'Left', hint:'No commitment made', color:'var(--oxblood)'}
];
const ONLINE_OUTCOME_OPTIONS = [
  {v:'ordered', label:'Ordered', hint:'Payment received', color:'var(--patina)'},
  {v:'declined', label:'Declined', hint:'Did not finalize', color:'var(--oxblood)'},
  {v:'still_deciding', label:'Still deciding — following up', hint:'Resolve later from the Card Log', color:'var(--brass)'}
];
const LOCATION_OPTIONS = [
  {v:'same_city', label:'Same city'},
  {v:'other_city_pk', label:'Other city, Pakistan'},
  {v:'abroad', label:'Abroad'}
];

let state = {
  screen:'staff', stepIndex:0, employee:null, visitId:null,
  pickerLevel:'top', activeParent:null, subScreen:null,
  visitTimestamp:'',
  channel:null,
  gender:null, competitorMentioned:false, referralMentioned:false, customerHistory:'',
  considerations:[], pendingItem:null, groupComposition:null, refreshment:null,
  variant:null, variantType:null, weightDirection:null,
  imageHandling:null,
  price:null, pushbackReason:null, outcome:null,
  contactShared:null, contactName:'', contactPhone:'', onlineLocation:null,
  logCards:[], logDetail:null, logEditName:'', logEditPhone:'', logEditHistory:null, logEditOutcome:''
};

// Formats "now" (or any Date) into the local yyyy-MM-ddThh:mm format an
// <input type="datetime-local"> expects — not UTC, so it matches the clock on the phone.
function toLocalDatetimeInput(d){
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function freshCardState(){
  return {
    visitTimestamp: toLocalDatetimeInput(new Date()),
    channel:null,
    gender:null, competitorMentioned:false, referralMentioned:false, customerHistory:'',
    considerations:[], pendingItem:null, groupComposition:null, refreshment:null,
    variant:null, variantType:null, weightDirection:null,
    imageHandling:null,
    price:null, pushbackReason:null, outcome:null,
    contactShared:null, contactName:'', contactPhone:'', onlineLocation:null
  };
}

function newVisitId(){
  return 'v' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
}

async function getCount(){ try{ const r = await window.storage.get('cards_today', false); return r?parseInt(r.value,10):0; }catch(e){ return 0; } }
async function bumpCount(){ try{ const c = await getCount(); await window.storage.set('cards_today', String(c+1), false); return c+1; }catch(e){ return 0; } }

function icon(name){
  const icons = {
    ring:'<circle cx="12" cy="14" r="6"/><path d="M9 8l3-5 3 5" stroke-linecap="round" stroke-linejoin="round"/>',
    circle:'<circle cx="12" cy="12" r="7"/>',
    drop:'<path d="M12 3c3 4 5 6.5 5 9.5A5 5 0 1 1 7 12.5C7 9.5 9 7 12 3z"/>',
    set:'<rect x="4" y="7" width="16" height="12" rx="2"/><path d="M9 7V5a3 3 0 0 1 6 0v2"/>',
    other:'<circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="6" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="18" cy="12" r="1.4" fill="currentColor" stroke="none"/>'
  };
  return `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">${icons[name]||icons.other}</svg>`;
}

function setTopbar(mode, stepIdx){
  const back = document.getElementById('backBtn');
  const mid = document.getElementById('topMid');
  if(mode==='dots'){
    back.classList.add('show');
    const total = activeSteps().length;
    let dots='';
    for(let i=1;i<=total;i++){ dots += `<div class="dot ${i<stepIdx?'done':(i===stepIdx?'current':'')}"></div>`; }
    mid.outerHTML = `<div class="dots" id="topMid">${dots}</div>`;
  } else {
    back.classList.remove('show');
    if(document.getElementById('topMid').className!=='brand-mark'){
      document.getElementById('topMid').outerHTML = `<div class="brand-mark" id="topMid">Nafees</div>`;
    }
  }
}

function goBack(){
  if(state.screen!=='card') return;
  if(state.subScreen==='considerationWeight'){ state.subScreen=null; state.pendingItem=null; render(); return; }
  if(state.subScreen){ state.subScreen=null; render(); return; }
  const steps = activeSteps();
  if(steps[state.stepIndex]==='consideration' && state.pickerLevel==='sub'){ state.pickerLevel='top'; state.activeParent=null; render(); return; }
  if(state.stepIndex>0){ state.stepIndex--; render(); }
  else { state.screen='home'; render(); }
}

function nextStep(){
  const steps = activeSteps();
  if(state.stepIndex<steps.length-1){ state.stepIndex++; render(); }
}

function resetDemo(){
  state = {screen:'staff', stepIndex:0, employee:null, visitId:null, pickerLevel:'top', activeParent:null, subScreen:null,
    ...freshCardState(),
    logCards:[], logDetail:null, logEditName:'', logEditPhone:'', logEditHistory:null, logEditOutcome:''};
  render();
}

async function render(){
  const app = document.getElementById('app');
  if(state.screen==='staff'){
    setTopbar('brand');
    app.innerHTML = `
      <h1 class="title">Who's closing<br>this card?</h1>
      <p class="sub">Tap your name once at the start of your shift.</p>
      <div class="staff-grid">
        ${STAFF.map(s=>`<div class="staff-tile" onclick="selectStaff('${s.id}','${s.name}')">
          <div class="staff-avatar">${s.name[0]}</div><div class="staff-name">${s.name}</div></div>`).join('')}
      </div>
      <div class="change-staff" onclick="testBackendConnection()">Test backend connection</div>`;
  }

  if(state.screen==='home'){
    setTopbar('brand');
    const count = await getCount();
    app.innerHTML = `
      <div class="home-wrap">
        <div class="home-header">
          <div class="home-greeting">Welcome, ${state.employee}</div>
          <div class="home-sub">Ready for the next customer</div>
        </div>
        <div class="big-cta" onclick="startCard()">
          <div class="plus">+</div><div class="cta-label">New Closing Card</div>
        </div>
        <div class="stat-row"><div><div class="stat-num">${count}</div><div class="stat-label">recorded this shift</div></div></div>
        <div class="change-staff" onclick="openLog()">View Card Log</div>
        <div class="change-staff" onclick="state.screen='staff'; render();">Not ${state.employee}? Switch staff</div>
      </div>`;
  }

  if(state.screen==='card'){
    const steps = activeSteps();
    if(state.subScreen==='considerationWeight'){ setTopbar('dots', steps.indexOf('consideration')+1); renderConsiderationWeight(app); return; }
    if(state.subScreen==='variantType'){ setTopbar('dots', steps.indexOf('variant')+1); renderVariantType(app); return; }
    if(state.subScreen==='weightDirection'){ setTopbar('dots', steps.indexOf('variant')+1); renderWeightDirection(app); return; }
    if(state.subScreen==='pushbackReason'){ setTopbar('dots', steps.indexOf('price')+1); renderPushbackReason(app); return; }
    if(state.subScreen==='contact'){ setTopbar('dots', steps.indexOf('outcome')+1); renderContact(app); return; }
    if(state.subScreen==='contactDirect'){ setTopbar('dots', steps.indexOf('outcome')+1); renderContactDirect(app); return; }
    if(state.subScreen==='onlineDetails'){ setTopbar('dots', steps.indexOf('outcome')+1); renderOnlineDetails(app); return; }
    setTopbar('dots', state.stepIndex+1);
    const name = steps[state.stepIndex];
    if(name==='timestamp') renderStepTimestamp(app);
    if(name==='channel') renderStepChannel(app);
    if(name==='gender') renderStepGender(app);
    if(name==='context') renderStepContext(app);
    if(name==='consideration') renderStep1(app);
    if(name==='group') renderStepGroup(app);
    if(name==='refreshment') renderStepRefreshment(app);
    if(name==='variant') renderStepVariant(app);
    if(name==='image') renderStepImage(app);
    if(name==='price') renderStepPrice(app);
    if(name==='outcome') renderStepOutcome(app);
  }

  if(state.screen==='log'){
    setTopbar('brand');
    if(state.logCards===null){
      app.innerHTML = `<p class="sub">Loading recent cards&hellip;</p>`;
    } else if(state.logCards.length===0){
      app.innerHTML = `
        <h1 class="title">Card Log</h1>
        <p class="sub">No cards found yet, or the backend isn't connected — check BACKEND_URL.</p>
        <button class="cta ghost" onclick="state.screen='home'; render();">Back</button>`;
    } else {
      app.innerHTML = `
        <h1 class="title">Card Log</h1>
        <p class="sub">Last ${state.logCards.length} — tap one to view or edit.</p>
        ${state.logCards.map((c,i)=>`
          <div class="sub-list-item" onclick="openLogDetail(${i})">
            ${c['Channel']==='online'?'Online — ':''}${c['Employee']||'—'} · ${c['Outcome']||c['Status']||'—'}<br>
            <span style="font-weight:400; font-size:12px; color:#8A8073;">
              ${c['Consideration Item 1']||''} ${c['Contact Name']?(' · '+c['Contact Name']):''}
            </span>
          </div>`).join('')}
        <button class="cta ghost" onclick="state.screen='home'; render();">Back</button>`;
    }
  }

  if(state.screen==='logDetail' && state.logDetail){
    setTopbar('brand');
    const c = state.logDetail;
    const channel = c['Channel'] || 'physical';
    const outcomeOpts = channel==='online' ? ONLINE_OUTCOME_OPTIONS : PHYSICAL_OUTCOME_OPTIONS;
    app.innerHTML = `
      <h1 class="title">Card detail</h1>
      <p class="sub">${channel==='online'?'Online — ':''}${c['Employee']||'—'} · ${c['Outcome']||c['Status']||'—'} · ${c['Consideration Item 1']||'—'}</p>

      <div class="field-label" style="margin-top:10px;">Customer history — for you or Zahid to fill in, not staff</div>
      ${HISTORY_OPTIONS.map(o=>`<div class="option-card ${state.logEditHistory===o.v?'selected':''}" onclick="setLogHistory('${o.v}')">
        <div class="opt-label">${o.label}</div></div>`).join('')}
      <div class="field-label" style="margin-top:10px;">Outcome — update if it's since resolved</div>
      ${outcomeOpts.map(o=>`<div class="option-card ${state.logEditOutcome===o.v?'selected':''}" onclick="setLogOutcome('${o.v}')">
        <div class="opt-label">${o.label}</div></div>`).join('')}
      <button class="cta" onclick="saveLogEdit()">Save changes</button>
      <button class="cta ghost" onclick="state.screen='log'; render();">Back to log</button>`;
  }

  if(state.screen==='confirm'){
    setTopbar('brand');
    const now = new Date();
    const code = `NJ · ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    app.innerHTML = `
      <div class="confirm-wrap">
        <div class="stamp"><div class="stamp-mark">&#10003;</div><div class="stamp-code">${code}</div></div>
        <div class="confirm-title">Closing Card recorded</div>
        <div class="confirm-sub">Back to the counter — thank you.</div>
        ${(!BACKEND_URL || BACKEND_URL.indexOf('PASTE_YOUR')===0) ? '<div class="confirm-sub" style="margin-top:14px; opacity:.7;">Local-only mode — backend not yet connected</div>' : ''}
      </div>`;
    setTimeout(()=>{
      state.screen='home'; state.stepIndex=0; state.visitId=null; state.pickerLevel='top'; state.activeParent=null; state.subScreen=null;
      Object.assign(state, freshCardState());
      render();
    }, 1900);
  }
}

function selectStaff(id,name){ state.employee = name; state.screen='home'; render(); }
function startCard(){
  state.screen='card'; state.stepIndex=0; state.visitId=newVisitId(); state.pickerLevel='top'; state.activeParent=null; state.subScreen=null;
  Object.assign(state, freshCardState());
  render();
  // fires the instant a card is opened — this is what guarantees a visit is counted
  // even if the card is abandoned partway through.
  sendToBackend({action:'start', visitId: state.visitId, employee: state.employee, clientTimestamp: new Date().toISOString()});
}

async function openLog(){
  state.screen='log'; state.logCards=null; render();
  if(!BACKEND_URL || BACKEND_URL.indexOf('PASTE_YOUR')===0){ state.logCards=[]; render(); return; }
  try{
    const res = await fetch(BACKEND_URL);
    const data = await res.json();
    state.logCards = data.cards || [];
  }catch(e){ state.logCards = []; }
  render();
}
function openLogDetail(i){
  state.logDetail = state.logCards[i];
  state.logEditName = state.logDetail['Contact Name'] || '';
  state.logEditPhone = state.logDetail['Contact Phone'] || '';
  state.logEditHistory = state.logDetail['Customer History'] || '';
  state.logEditOutcome = state.logDetail['Outcome'] || '';
  state.screen='logDetail';
  render();
}
function setLogHistory(v){ state.logEditHistory = v; render(); }
function setLogOutcome(v){ state.logEditOutcome = v; render(); }
async function saveLogEdit(){
  await sendToBackend({
    action:'update',
    visitId: state.logDetail['Visit ID'],
    contactName: state.logEditName,
    contactPhone: state.logEditPhone,
    customerHistory: state.logEditHistory,
    outcome: state.logEditOutcome
  });
  state.screen='log';
  openLog();
}

  finishCard();
}
function renderContactDirect(app){
  const labels = {
    purchased:'for matching against today\u2019s sales record',
    reserved_deposit:'for the deposit and pickup',
    custom_order:'for the order and collection',
    held_no_deposit:'so the hold is tied to the right person'
  };
  app.innerHTML = `
    <h1 class="title">Customer name<br>&amp; number</h1>
    <p class="sub">Whatever was already taken ${labels[state.outcome]||''} — enter it here too, so this record can be matched against it later.</p>
    <div class="field-label">Name</div>
    <input class="text-input" id="cNameD" placeholder="e.g. Fatima Khan" value="${state.contactName}" oninput="state.contactName=this.value">
    <div class="field-label">Phone (most reliable for matching)</div>
    <input class="text-input" id="cPhoneD" placeholder="03xx-xxxxxxx" value="${state.contactPhone}" oninput="state.contactPhone=this.value">
    <button class="cta" onclick="saveDirectContactAndFinish()">Save</button>
  `;
}
function saveDirectContactAndFinish(){
  state.contactShared = true;
  finishCard();
}
function renderContact(app){
  app.innerHTML = `
    <h1 class="title">Did they share<br>contact info?</h1>
    <p class="sub">No commitment was made — only if they offered it, never ask beyond what they volunteer.</p>
    <div class="yesno-row">
      <div class="yesno-btn ${state.contactShared===true?'active':''}" onclick="setContactShared(true)">Yes</div>
      <div class="yesno-btn ${state.contactShared===false?'active':''}" onclick="setContactShared(false)">No</div>
    </div>
    ${state.contactShared===true ? `
      <div class="field-label">Name (optional)</div>
      <input class="text-input" id="cName" placeholder="e.g. Fatima Khan" value="${state.contactName}" oninput="state.contactName=this.value">
      <div class="field-label">Phone (optional)</div>
      <input class="text-input" id="cPhone" placeholder="03xx-xxxxxxx" value="${state.contactPhone}" oninput="state.contactPhone=this.value">
      <button class="cta" onclick="finishCard()">Save</button>
    ` : (state.contactShared===false ? `<button class="cta" onclick="finishCard()">Continue</button>` : '')}
  `;
}
function setContactShared(v){ state.contactShared=v; render(); }

function buildPayload(){
  return {
    action: 'complete',
    visitId: state.visitId,
    employee: state.employee,
    visitTimestamp: state.visitTimestamp,
    channel: state.channel || 'physical',
    gender: state.gender,
    competitorMentioned: state.competitorMentioned,
    referralMentioned: state.referralMentioned,
    considerations: state.considerations,
    groupComposition: state.groupComposition,
    refreshment: state.refreshment,
    variant: state.variant,
    variantType: state.variantType,
    weightDirection: state.weightDirection,
    imageHandling: state.imageHandling,
    price: state.price,
    pushbackReason: state.pushbackReason,
    outcome: state.outcome,
    contactShared: state.contactShared,
    contactName: state.contactName,
    contactPhone: state.contactPhone,
    onlineLocation: state.onlineLocation,
    customerHistory: state.customerHistory,
    clientTimestamp: new Date().toISOString()
  };
}

async function getQueue(){ try{ const r = await window.storage.get('pending_queue', false); return r ? JSON.parse(r.value) : []; }catch(e){ return []; } }
async function setQueue(q){ try{ await window.storage.set('pending_queue', JSON.stringify(q), false); }catch(e){ /* best effort */ } }

async function sendToBackend(payload){
  if(!BACKEND_URL || BACKEND_URL.indexOf('PASTE_YOUR')===0){ return false; } // not configured yet — local-only mode
  try{
    await fetch(BACKEND_URL, {
      method:'POST',
      mode:'no-cors', // Apps Script responds via a redirect Chrome/Safari won't expose to JS anyway —
                       // 'no-cors' stops that redirect handling from throwing even when the write succeeds.
      headers:{'Content-Type':'text/plain;charset=utf-8'}, // avoids a CORS preflight against Apps Script
      body: JSON.stringify(payload)
    });
    return true;
  }catch(e){
    console.error('Closing Card backend error:', e);
    return false;
  }
}

// Diagnostic only. Sends a harmless start-ping via POST and GET and reports plainly
// whether each was sent without a JS-level error — it can't confirm the write actually
// landed, since 'no-cors' hides the response, so always check the sheet too.
async function testBackendConnection(){
  if(!BACKEND_URL || BACKEND_URL.indexOf('PASTE_YOUR')===0){
    alert('BACKEND_URL is still the placeholder — paste your Apps Script Web App URL in first.');
    return;
  }
  let postOk = false, getOk = false, postErr = '', getErr = '';
  try{
    await fetch(BACKEND_URL, {
      method:'POST', mode:'no-cors',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({action:'start', visitId:'test_post_'+Date.now(), employee:'Connection Test (POST)'})
    });
    postOk = true;
  }catch(e){ postErr = e.message; }

  try{
    await fetch(BACKEND_URL + '?ping=1&visitId=test_get_' + Date.now() + '&employee=' + encodeURIComponent('Connection Test (GET)'), {
      method:'GET', mode:'no-cors'
    });
    getOk = true;
  }catch(e){ getErr = e.message; }

  alert(
    'POST attempt: ' + (postOk ? 'sent without error' : ('failed — ' + postErr)) + '\n' +
    'GET attempt: ' + (getOk ? 'sent without error' : ('failed — ' + getErr)) + '\n\n' +
    'Now check the ClosingCards sheet for rows named "Connection Test (POST)" and "Connection Test (GET)".'
  );
}

async function flushQueue(){
  if(!BACKEND_URL || BACKEND_URL.indexOf('PASTE_YOUR')===0) return;
  let queue = await getQueue();
  if(queue.length===0) return;
  const remaining = [];
  for(const item of queue){
    const ok = await sendToBackend(item);
    if(!ok) remaining.push(item);
  }
  await setQueue(remaining);
}

async function finishCard(){
  state.subScreen=null;
  const payload = buildPayload();
  await bumpCount();

  // try to flush any earlier failed submissions first, then send this one
  await flushQueue();
  const ok = await sendToBackend(payload);
  if(!ok && BACKEND_URL && BACKEND_URL.indexOf('PASTE_YOUR')!==0){
    const queue = await getQueue();
    queue.push(payload);
    await setQueue(queue);
  }

  state.screen='confirm';
  render();
}

// attempt to flush any queued cards from a previous offline moment as soon as the app opens
flushQueue();
render();
</script>
